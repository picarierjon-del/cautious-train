<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gestionale Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        .glass { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.3); }
        .status-dot { transition: all 0.5s ease; }
        .input-pro { @apply w-full bg-gray-50 border border-gray-200 rounded-lg p-3 text-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition-all; }
        @media print { .no-print { display: none; } }
    </style>
</head>
<body class="bg-[#f8fafc] text-slate-900 pb-10">

    <nav class="sticky top-0 z-50 glass px-4 py-3 mb-4 flex justify-between items-center shadow-sm">
        <h1 class="font-bold text-xl tracking-tight text-blue-600">SmartGestionale<span class="text-slate-400 font-light">PRO</span></h1>
        <button onclick="resetOggi()" class="text-xs font-semibold bg-red-50 text-red-600 px-3 py-1 rounded-full border border-red-100 uppercase tracking-wider">Reset</button>
    </nav>

    <div class="max-w-md mx-auto px-4 space-y-6">

        <div id="statusBg" class="p-5 rounded-3xl shadow-lg border transition-all duration-500">
            <div class="flex items-center gap-4">
                <div id="statusIcon" class="text-4xl">🟢</div>
                <div>
                    <p id="statusTag" class="text-[10px] font-black uppercase tracking-[0.2em] opacity-60">Stato Operativo</p>
                    <h2 id="statusMsg" class="text-lg font-bold leading-tight italic">Tutto in ordine per oggi</h2>
                </div>
            </div>
        </div>

        <div class="glass p-5 rounded-3xl shadow-sm">
            <h3 class="text-xs font-bold text-slate-400 uppercase mb-4 tracking-widest">Analisi Incassi</h3>
            <div class="h-40 w-full">
                <canvas id="mainChart"></canvas>
            </div>
        </div>

        <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-100">
            <div class="flex items-center gap-2 mb-6">
                <div class="w-1 h-6 bg-blue-500 rounded-full"></div>
                <h3 class="font-bold text-slate-700">Incassi Giornalieri</h3>
            </div>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-[10px] font-bold text-slate-400 uppercase ml-1 mb-1">Corrispettivo Totale (Lordo)</label>
                    <input type="number" id="total_sales" class="input-pro font-semibold text-2xl text-blue-700" placeholder="0.00">
                </div>
                
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-[10px] font-bold text-slate-400 uppercase ml-1 mb-1">Bancomat/POS</label>
                        <input type="number" id="bancomat" class="input-pro text-base" placeholder="0.00">
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-slate-400 uppercase ml-1 mb-1">App/Satispay</label>
                        <input type="number" id="altri_elettr" class="input-pro text-base" placeholder="0.00">
                    </div>
                </div>
            </div>
        </div>

        <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-100">
            <div class="flex justify-between items-center mb-6">
                <div class="flex items-center gap-2">
                    <div class="w-1 h-6 bg-orange-500 rounded-full"></div>
                    <h3 class="font-bold text-slate-700">Uscite Fornitori</h3>
                </div>
                <span id="supCount" class="bg-slate-100 text-slate-500 text-[10px] px-2 py-1 rounded-md font-bold text-xs">10 SLOT</span>
            </div>
            
            <div id="suppliersContainer" class="space-y-3 max-h-80 overflow-y-auto pr-2">
                </div>
        </div>

        <div class="bg-slate-900 text-white p-8 rounded-[2.5rem] shadow-2xl relative overflow-hidden">
            <div class="absolute top-0 right-0 w-32 h-32 bg-blue-500/10 rounded-full -mr-16 -mt-16"></div>
            
            <div class="space-y-5 relative z-10">
                <div class="flex justify-between items-center opacity-70">
                    <span class="text-sm">Contanti Teorici</span>
                    <span id="cash_theo" class="font-mono tracking-tighter">€ 0.00</span>
                </div>
                <div class="flex justify-between items-center opacity-70 border-b border-white/10 pb-3">
                    <span class="text-sm">Spese Cash</span>
                    <span id="sup_cash" class="font-mono text-orange-400">- € 0.00</span>
                </div>
                <div class="flex justify-between items-end pt-2">
                    <div>
                        <p class="text-[10px] font-bold text-blue-400 uppercase tracking-widest">Disponibile da versare</p>
                        <h4 class="text-4xl font-bold tracking-tighter">€ <span id="cash_net">0.00</span></h4>
                    </div>
                    <button onclick="window.print()" class="no-print bg-white/10 p-3 rounded-2xl hover:bg-white/20 transition-all">
                        📄
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let myChart;

        // Inizializza l'app
        function init() {
            renderSuppliers();
            initChart();
            loadData();
            
            // Aggiunge listener a tutti gli input
            document.querySelectorAll('input').forEach(input => {
                input.addEventListener('input', () => {
                    calculate();
                    saveData();
                });
            });
        }

        function renderSuppliers() {
            const container = document.getElementById('suppliersContainer');
            for (let i = 1; i <= 10; i++) {
                const row = document.createElement('div');
                row.className = "flex items-center gap-3 bg-slate-50 p-3 rounded-2xl border border-slate-200/50";
                row.innerHTML = `
                    <span class="text-[10px] font-bold text-slate-300 w-4">${i}</span>
                    <input type="number" class="sup-amt bg-transparent w-full outline-none font-semibold text-sm" placeholder="Importo €">
                    <label class="flex items-center gap-2 cursor-pointer">
                        <input type="checkbox" class="sup-check w-5 h-5 rounded-full accent-green-500">
                        <span class="text-[10px] font-bold text-slate-400 uppercase">Cash</span>
                    </label>
                `;
                container.appendChild(row);
            }
        }

        function calculate() {
            const total = parseFloat(document.getElementById('total_sales').value) || 0;
            const pos = parseFloat(document.getElementById('bancomat').value) || 0;
            const app = parseFloat(document.getElementById('altri_elettr').value) || 0;
            
            const electronicTotal = pos + app;
            const cashTheoretical = total - electronicTotal;
            
            let supplierCash = 0;
            document.querySelectorAll('.sup-amt').forEach((el, i) => {
                if (document.querySelectorAll('.sup-check')[i].checked) {
                    supplierCash += parseFloat(el.value) || 0;
                }
            });

            const netCash = cashTheoretical - supplierCash;

            // Update UI
            document.getElementById('cash_theo').innerText = `€ ${cashTheoretical.toFixed(2)}`;
            document.getElementById('sup_cash').innerText = `- € ${supplierCash.toFixed(2)}`;
            document.getElementById('cash_net').innerText = netCash.toFixed(2);

            updateStatus(total, electronicTotal, cashTheoretical, netCash);
            updateChart(cashTheoretical, electronicTotal);
        }

        function updateStatus(total, elec, theo, net) {
            const bg = document.getElementById('statusBg');
            const icon = document.getElementById('statusIcon');
            const msg = document.getElementById('statusMsg');

            if (elec > total || theo < 0) {
                bg.className = "p-5 rounded-3xl shadow-lg border bg-red-50 border-red-200 text-red-900";
                icon.innerText = "🚨";
                msg.innerText = "Dati Incoerenti: l'elettronico supera il totale!";
            } else if (total === 0) {
                bg.className = "p-5 rounded-3xl shadow-lg border bg-amber-50 border-amber-200 text-amber-900";
                icon.innerText = "✍️";
                msg.innerText = "In attesa dei corrispettivi di oggi";
            } else if (net > 0) {
                bg.className = "p-5 rounded-3xl shadow-lg border bg-blue-50 border-blue-200 text-blue-900";
                icon.innerText = "💰";
                msg.innerText = `Mancano €${net.toFixed(2)} nel sacchetto del versamento`;
            } else {
                bg.className = "p-5 rounded-3xl shadow-lg border bg-green-50 border-green-200 text-green-900";
                icon.innerText = "✅";
                msg.innerText = "Tutto perfetto. Corrispettivi allineati.";
            }
        }

        function initChart() {
            const ctx = document.getElementById('mainChart').getContext('2d');
            myChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['Contanti', 'Elettronico'],
                    datasets: [{
                        data: [0, 0],
                        backgroundColor: ['#3b82f6', '#e2e8f0'],
                        borderWidth: 0,
                        cutout: '80%'
                    }]
                },
                options: { plugins: { legend: { display: false } }, maintainAspectRatio: false }
            });
        }

        function updateChart(cash, elec) {
            myChart.data.datasets[0].data = [cash > 0 ? cash : 0, elec];
            myChart.update();
        }

        // --- SISTEMA DI SALVATAGGIO ---
        function saveData() {
            const data = {
                total: document.getElementById('total_sales').value,
                pos: document.getElementById('bancomat').value,
                app: document.getElementById('altri_elettr').value,
                suppliers: Array.from(document.querySelectorAll('.sup-amt')).map(el => el.value),
                checks: Array.from(document.querySelectorAll('.sup-check')).map(el => el.checked)
            };
            localStorage.setItem('dayData', JSON.stringify(data));
        }

        function loadData() {
            const saved = localStorage.getItem('dayData');
            if (!saved) return;
            const data = JSON.parse(saved);
            document.getElementById('total_sales').value = data.total;
            document.getElementById('bancomat').value = data.pos;
            document.getElementById('altri_elettr').value = data.app;
            document.querySelectorAll('.sup-amt').forEach((el, i) => el.value = data.suppliers[i]);
            document.querySelectorAll('.sup-check').forEach((el, i) => el.checked = data.checks[i]);
            calculate();
        }

        function resetOggi() {
            if(confirm("Vuoi cancellare i dati di oggi?")) {
                localStorage.clear();
                location.reload();
            }
        }

        init();
    </script>
</body>
</html>
