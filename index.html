<!DOCTYPE html>
<html lang="it" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>OMNIA COMMANDER - Pro Edition</title>

  <link rel="manifest" href="data:application/manifest+json,{%22name%22:%22OmniaCommander%22,%22short_name%22:%22Omnia%22,%22start_url%22:%22.%22,%22display%22:%22standalone%22,%22background_color%22:%22#020617%22,%22theme_color%22:%22#020617%22}">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700;800&family=JetBrains+Mono:wght@500;800&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #020617; color: #f8fafc; -webkit-tap-highlight-color: transparent; }
    .glass-card { background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(51, 65, 85, 0.3); border-radius: 20px; }
    .input-pro { background: #0f172a; border: 1px solid #1e293b; color: white; border-radius: 12px; padding: 12px; width: 100%; outline: none; text-align: center; font-weight: bold; transition: border 0.2s; }
    .input-pro:focus { border-color: #3b82f6; }
    .tab-btn { flex: 1; padding: 10px; font-size: 10px; font-weight: 800; border-radius: 12px; color: #64748b; transition: all 0.3s; }
    .tab-btn.active { background: #3b82f6; color: white; box-shadow: 0 0 15px rgba(59, 130, 246, 0.3); }
    .hidden { display: none !important; }
    .mono { font-family: 'JetBrains Mono', monospace; }
    .mini-btn { background:#0f172a; border:1px solid #1e293b; padding:8px 12px; border-radius:12px; font-weight:900; font-size:10px; text-transform: uppercase; }
  </style>
</head>

<body class="pb-52">

  <div id="authScreen" class="fixed inset-0 z-[9999] bg-[#020617] flex items-center justify-center p-6">
    <div class="text-center space-y-6 p-10 glass-card w-full max-w-sm border-t-4 border-blue-600 shadow-2xl">
      <h1 class="text-3xl font-black italic tracking-tighter">OMNIA<span class="text-blue-500">COMMANDER</span></h1>
      <input type="password" id="pinInput" class="input-pro text-3xl tracking-[0.5em]" placeholder="****" maxlength="4" inputmode="numeric">
      <button id="btnUnlock" class="w-full bg-blue-600 hover:bg-blue-500 py-4 rounded-xl font-black uppercase shadow-lg">Sblocca</button>
      <p class="text-[9px] text-slate-600 uppercase tracking-widest">Secure Access v2.2</p>
    </div>
  </div>

  <div id="mainUI" class="hidden">

    <nav class="sticky top-0 z-50 bg-[#020617]/90 border-b border-slate-800 p-4 flex justify-between items-center backdrop-blur-md">
      <div>
        <p id="topDate" class="text-[9px] font-black text-blue-500 uppercase"></p>
        <h1 class="text-lg font-black italic uppercase">Dashboard <span class="text-blue-500">Pro</span></h1>
      </div>
      <div class="flex gap-2">
        <button id="btnPdf" class="mini-btn text-blue-400">PDF</button>
        <button id="btnWhatsapp" class="mini-btn text-green-500">WA</button>
      </div>
    </nav>

    <div class="p-4 grid grid-cols-2 gap-3">
      <div class="glass-card p-4 col-span-2 flex justify-between items-center bg-gradient-to-br from-blue-900/20 to-transparent">
        <div>
          <p class="text-[8px] font-bold text-slate-500 uppercase mb-1 tracking-widest">Netto Cassa Reale</p>
          <h3 id="netCashDisplay" class="text-3xl font-black text-green-400 mono">€ 0.00</h3>
          <p id="splitInfo" class="text-[9px] font-medium text-slate-500 italic mt-2">Attendendo input...</p>
        </div>
        <div class="text-right">
          <p class="text-[8px] font-bold text-red-500 uppercase">Tasse</p>
          <h3 id="taxReserve" class="text-lg font-black text-red-500 mono">€ 0</h3>
        </div>
      </div>
    </div>

    <div class="flex gap-1 p-1 bg-slate-900 mx-4 rounded-2xl border border-slate-800 shadow-inner">
      <button data-tab="day" id="t1" class="tab-btn active uppercase">Operativo</button>
      <button data-tab="bank" id="t2" class="tab-btn uppercase">Cassa</button>
      <button data-tab="stats" id="t3" class="tab-btn uppercase">Trend</button>
      <button data-tab="config" id="t4" class="tab-btn uppercase">Setup</button>
    </div>

    <div id="sec-day" class="p-4 space-y-4">
      <div class="flex gap-2 items-center">
        <button id="btnPrevDay" class="bg-slate-800 p-3 rounded-xl text-blue-500">◀</button>
        <input type="date" id="datePicker" class="input-pro text-xs grow">
        <button id="btnNextDay" class="bg-slate-800 p-3 rounded-xl text-blue-500">▶</button>
      </div>

      <div class="glass-card p-6 text-center border-b-4 border-blue-600/30">
        <span class="text-[10px] font-black text-slate-500 uppercase tracking-widest">Totale Lordo (Z)</span>
        <input type="number" id="total_sales" class="bg-transparent text-5xl font-black text-white w-full text-center outline-none mt-2" placeholder="0.00" inputmode="decimal">
        
        <div class="grid grid-cols-2 gap-4 mt-6 pt-6 border-t border-slate-800/50">
          <input type="number" id="n_clients" class="bg-slate-800/50 rounded-xl p-3 font-bold text-center border border-slate-700" placeholder="Clienti" inputmode="numeric">
          <input type="number" id="acconti" class="bg-orange-900/10 rounded-xl p-3 font-bold text-center border border-orange-900/30 text-orange-400" placeholder="Acconti €" inputmode="decimal">
        </div>
      </div>

      <div class="glass-card p-4 grid grid-cols-2 gap-3">
        <div class="col-span-2 text-[9px] font-black text-blue-400 uppercase italic">Pagamenti Digitali</div>
        <input type="number" id="p_bancomat" class="input-pro text-xs" placeholder="Bancomat" inputmode="decimal">
        <input type="number" id="p_sumup" class="input-pro text-xs" placeholder="Altro POS" inputmode="decimal">
        <input type="number" id="p_satispay" class="input-pro text-xs" placeholder="Satispay" inputmode="decimal">
        <input type="number" id="p_delivery_tot" class="input-pro text-xs" placeholder="Delivery" inputmode="decimal">
      </div>

      <div class="glass-card p-4">
        <div class="flex items-center justify-between mb-4">
          <h4 class="text-[10px] font-black text-slate-500 uppercase tracking-widest">Uscite Fornitori</h4>
          <button id="btnEditSuppliers" class="mini-btn text-blue-400">Modifica Nomi</button>
        </div>
        <div id="supList" class="space-y-2"></div>
      </div>

      <textarea id="dailyNote" class="w-full bg-[#0f172a] border border-slate-800 rounded-xl p-3 text-xs italic text-slate-300 outline-none glass-card" rows="2" placeholder="Note sulla giornata..."></textarea>
    </div>

    <div id="sec-config" class="p-4 hidden space-y-4">
      <div class="glass-card p-6 space-y-5">
        <h3 class="text-sm font-black text-blue-500 uppercase italic">Parametri Mensili</h3>
        <input type="number" id="fixed_costs" class="input-pro" placeholder="Spese Fisse €">
        <input type="number" id="labor_costs" class="input-pro" placeholder="Stipendi €">
        <input type="number" id="tax_rate" class="input-pro" placeholder="Aliquota %" value="25">
        
        <div class="grid grid-cols-2 gap-2 pt-6">
          <button id="btnExport" class="mini-btn text-slate-200 py-3">Backup JSON</button>
          <label class="mini-btn text-slate-200 py-3 text-center cursor-pointer">Import<input id="restoreFile" type="file" class="hidden"></label>
        </div>
        <button id="btnWipeAll" class="w-full bg-red-900/20 text-red-500 py-3 rounded-xl text-[10px] font-black uppercase">Cancella Tutto</button>
      </div>
    </div>

    <div id="sec-stats" class="p-4 hidden space-y-4">
        <div class="glass-card p-4 h-64"><canvas id="mainChart"></canvas></div>
    </div>
    
    <div id="sec-bank" class="p-4 hidden space-y-4">
        <div class="glass-card p-6 border-l-4 border-green-500">
            <p class="text-[10px] font-black text-slate-500 uppercase">Totale Cash Settimanale</p>
            <div id="bankTotal" class="text-4xl font-black mono">€ 0.00</div>
        </div>
        <div id="bankHistory" class="space-y-2"></div>
    </div>

    <div class="fixed bottom-0 left-0 right-0 p-6 bg-[#020617]/95 border-t border-slate-800 backdrop-blur-xl flex justify-between items-center z-[100]">
      <div>
        <p class="text-[8px] font-black text-slate-500 uppercase">Cash Netto Oggi</p>
        <div id="theoCash" class="text-3xl font-black text-white mono">€ 0.00</div>
      </div>
      <button id="btnSave" class="bg-blue-600 text-white font-black px-12 py-5 rounded-2xl shadow-xl uppercase text-xs tracking-widest active:scale-95">Archivia</button>
    </div>

  </div>

  <div id="supModal" class="hidden fixed inset-0 z-[9998] bg-black/80 flex items-end">
    <div class="w-full glass-card rounded-t-[40px] p-8 border border-slate-700 animate-in slide-in-from-bottom">
      <h3 class="text-lg font-black text-blue-400 uppercase italic mb-4">Gestione Nomi Fornitori</h3>
      <div class="max-h-[40vh] overflow-auto space-y-2 mb-6" id="supConfigList"></div>
      <div class="grid grid-cols-2 gap-3">
          <button id="btnAddSup" class="bg-slate-800 py-4 rounded-xl font-black text-[10px]">+ AGGIUNGI</button>
          <button id="btnSaveSupConfig" class="bg-blue-600 py-4 rounded-xl font-black text-[10px]">SALVA</button>
      </div>
      <button id="btnCloseSupModal" class="w-full mt-4 text-slate-500 text-[10px] uppercase font-bold">Chiudi</button>
    </div>
  </div>

  <script>
    let activeDate = new Date();
    let chartInstance = null;
    const DB_KEY = 'omnia_v2_';
    const SUP_KEY = 'omnia_suppliers_v2';

    const el = {};
    const ids = ['authScreen','mainUI','pinInput','btnUnlock','topDate','datePicker','btnPrevDay','btnNextDay','total_sales','n_clients','acconti','dailyNote','p_bancomat','p_sumup','p_satispay','p_delivery_tot','supList','supTotal','supCashTotal','btnEditSuppliers','fixed_costs','labor_costs','tax_rate','btnWipeAll','netCashDisplay','taxReserve','avgTicket','theoCash','splitInfo','bankTotal','bankHistory','mainChart','btnSave','btnPdf','btnWhatsapp','supModal','supConfigList','btnCloseSupModal','btnSaveSupConfig','btnAddSup','btnExport','restoreFile'];
    ids.forEach(id => el[id] = document.getElementById(id));

    // Utils
    const fD = (d) => d.toISOString().split('T')[0];
    const money = (v) => new Intl.NumberFormat('it-IT', { style:'currency', currency:'EUR'}).format(v || 0);
    const parse = (v) => parseFloat(v) || 0;

    // Supplier Management
    function getSups() {
        return JSON.parse(localStorage.getItem(SUP_KEY)) || [{name:"Bevande"},{name:"Cibo"},{name:"Consumo"}];
    }

    function renderSuppliers() {
        const sups = getSups();
        el.supList.innerHTML = "";
        sups.forEach((s, i) => {
            const div = document.createElement('div');
            div.className = "flex gap-2 items-center bg-slate-900/40 p-3 rounded-xl border border-slate-800/50";
            div.innerHTML = `
                <div class="flex-1 text-[10px] font-black uppercase text-slate-300">${s.name}</div>
                <input type="number" step="0.01" class="sup-amt bg-slate-950 w-24 text-xs font-black border border-slate-800 rounded-lg p-2 text-center" placeholder="€" data-idx="${i}">
                <label class="flex items-center gap-1"><input type="checkbox" class="sup-check accent-orange-500 w-5 h-5" data-idx="${i}"></label>
            `;
            el.supList.appendChild(div);
        });
        document.querySelectorAll('.sup-amt, .sup-check').forEach(i => i.addEventListener('input', calc));
    }

    function calc() {
        const total = parse(el.total_sales.value);
        const acconti = parse(el.acconti.value);
        const digital = ['p_bancomat','p_sumup','p_satispay','p_delivery_tot'].reduce((acc,id)=> acc + parse(el[id].value), 0);
        
        let sTot = 0, sCash = 0;
        document.querySelectorAll('.sup-amt').forEach((input, i) => {
            const v = parse(input.value);
            sTot += v;
            if(document.querySelectorAll('.sup-check')[i].checked) sCash += v;
        });

        const net = (total - digital - sCash) + acconti;
        el.theoCash.innerText = money(net);
        el.netCashDisplay.innerText = money(net);
        el.taxReserve.innerText = money(total * (parse(el.tax_rate.value)/100));
        el.splitInfo.innerText = `Pos: ${money(digital)} • Uscite: ${money(sTot)}`;
    }

    // Save & Load
    function save() {
        const data = {
            total: el.total_sales.value,
            clients: el.n_clients.value,
            acconti: el.acconti.value,
            note: el.dailyNote.value,
            digital: { b: el.p_bancomat.value, s: el.p_sumup.value, sat: el.p_satispay.value, del: el.p_delivery_tot.value },
            supAmts: Array.from(document.querySelectorAll('.sup-amt')).map(i => i.value),
            supChecks: Array.from(document.querySelectorAll('.sup-check')).map(i => i.checked)
        };
        localStorage.setItem(DB_KEY + fD(activeDate), JSON.stringify(data));
        ['fixed_costs','labor_costs','tax_rate'].forEach(k => localStorage.setItem(k, el[k].value));
        alert("DATI ARCHIVIATI");
        calc();
    }

    function load() {
        const raw = localStorage.getItem(DB_KEY + fD(activeDate));
        renderSuppliers();
        if(raw) {
            const d = JSON.parse(raw);
            el.total_sales.value = d.total || "";
            el.n_clients.value = d.clients || "";
            el.acconti.value = d.acconti || "";
            el.dailyNote.value = d.note || "";
            el.p_bancomat.value = d.digital?.b || "";
            el.p_sumup.value = d.digital?.s || "";
            el.p_satispay.value = d.digital?.sat || "";
            el.p_delivery_tot.value = d.digital?.del || "";
            const amts = document.querySelectorAll('.sup-amt'), chks = document.querySelectorAll('.sup-check');
            (d.supAmts || []).forEach((v, i) => { if(amts[i]) amts[i].value = v; });
            (d.supChecks || []).forEach((v, i) => { if(chks[i]) chks[i].checked = v; });
        } else {
            ['total_sales','n_clients','acconti','dailyNote','p_bancomat','p_sumup','p_satispay','p_delivery_tot'].forEach(id => el[id].value="");
        }
        calc();
    }

    // WhatsApp Export
    el.btnWhatsapp.onclick = () => {
        const dateStr = activeDate.toLocaleDateString('it-IT', { weekday:'long', day:'numeric', month:'long' });
        const text = `*OMNIA COMMANDER REPORT*%0A📅 ${dateStr.toUpperCase()}%0A%0A💰 *INCASSI*%0A- Lordo Z: ${money(parse(el.total_sales.value))}%0A- Acconti: ${money(parse(el.acconti.value))}%0A%0A💳 *DIGITALE*%0A- Totale POS/Delivery: ${money(['p_bancomat','p_sumup','p_satispay','p_delivery_tot'].reduce((acc,id)=>acc+parse(el[id].value),0))}%0A%0A💸 *USCITE CASH*%0A- Fornitori: ${el.theoCash.innerText}%0A%0A📝 *NOTE*%0A${el.dailyNote.value || "Nessuna nota."}`;
        window.open(`https://wa.me/?text=${text}`, '_blank');
    };

    // PDF Export
    el.btnPdf.onclick = () => {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        doc.setFontSize(18);
        doc.text("OMNIA COMMANDER REPORT", 10, 20);
        doc.setFontSize(12);
        doc.text(`Data: ${activeDate.toLocaleDateString()}`, 10, 30);
        doc.text(`Lordo Z: ${money(parse(el.total_sales.value))}`, 10, 45);
        doc.text(`Cash Netto: ${el.theoCash.innerText}`, 10, 55);
        doc.text(`Note: ${el.dailyNote.value || "-"}`, 10, 70);
        doc.save(`report_${fD(activeDate)}.pdf`);
    };

    // Init
    el.btnUnlock.onclick = () => { if(el.pinInput.value === "1234"){ el.authScreen.classList.add('hidden'); el.mainUI.classList.remove('hidden'); boot(); } };
    
    function boot() {
        ['fixed_costs','labor_costs','tax_rate'].forEach(k => { if(localStorage.getItem(k)) el[k].value = localStorage.getItem(k); });
        el.datePicker.onchange = (e) => { activeDate = new Date(e.target.value); updateUI(); };
        el.btnPrevDay.onclick = () => { activeDate.setDate(activeDate.getDate()-1); updateUI(); };
        el.btnNextDay.onclick = () => { activeDate.setDate(activeDate.getDate()+1); updateUI(); };
        el.btnSave.onclick = save;
        el.btnEditSuppliers.onclick = () => {
            el.supModal.classList.remove('hidden');
            el.supConfigList.innerHTML = "";
            getSups().forEach(s => addSupRow(s.name));
        };
        el.btnAddSup.onclick = () => addSupRow("");
        el.btnSaveSupConfig.onclick = () => {
            const newS = Array.from(document.querySelectorAll('.cfg-name')).map(i => ({name: i.value}));
            localStorage.setItem(SUP_KEY, JSON.stringify(newS));
            el.supModal.classList.add('hidden');
            load();
        };
        el.btnCloseSupModal.onclick = () => el.supModal.classList.add('hidden');
        
        document.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => {
            document.querySelectorAll('.tab-btn').forEach(x => x.classList.remove('active'));
            b.classList.add('active');
            ['day','bank','stats','config'].forEach(s => el['sec-'+s].classList.add('hidden'));
            el['sec-'+b.dataset.tab].classList.remove('hidden');
        });

        updateUI();
    }

    function addSupRow(name) {
        const div = document.createElement('div');
        div.className = "flex gap-2";
        div.innerHTML = `<input class="cfg-name input-pro flex-1 !text-left" value="${name}"><button onclick="this.parentElement.remove()" class="text-red-500 px-2">✕</button>`;
        el.supConfigList.appendChild(div);
    }

    function updateUI() {
        el.datePicker.value = fD(activeDate);
        el.topDate.innerText = activeDate.toLocaleDateString('it-IT', { weekday:'long', day:'numeric', month:'long' });
        load();
    }
  </script>
</body>
</html>
