<!DOCTYPE html>
<html lang="it" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gestionale Pro DARK</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #f1f5f9; }
        .dark-card { background: #1e293b; border: 1px solid #334155; }
        .input-dark { background: #0f172a; border: 1px solid #334155; color: white; border-radius: 12px; padding: 12px; outline: none; transition: 0.2s; }
        .input-dark:focus { border-color: #3b82f6; ring: 2px solid #3b82f6; }
        @media print { .no-print { display: none; } }
    </style>
</head>
<body class="pb-20">

    <nav class="sticky top-0 z-50 bg-[#0f172a]/80 backdrop-blur-md px-4 py-4 border-b border-slate-800 flex justify-between items-center">
        <div>
            <h1 class="font-bold text-lg text-blue-400">SmartLog <span class="text-white">v2.0</span></h1>
            <p id="currentDateDisplay" class="text-[10px] text-slate-500 uppercase font-bold tracking-widest"></p>
        </div>
        <div class="flex gap-2">
            <button onclick="exportMonthlyPDF()" class="bg-green-600 hover:bg-green-700 text-white text-xs px-3 py-2 rounded-lg font-bold transition-all">📄 PDF MESE</button>
        </div>
    </nav>

    <div class="max-w-md mx-auto px-4 mt-6 space-y-6">

        <div id="statusCard" class="p-5 rounded-3xl border-l-8 bg-slate-800 transition-all">
            <h2 id="statusMsg" class="font-bold text-sm italic">Caricamento sistema...</h2>
        </div>

        <div class="dark-card p-6 rounded-3xl shadow-xl">
            <label class="block text-[10px] font-black text-blue-400 uppercase tracking-widest mb-2">Corrispettivo Lordo Odierno</label>
            <input type="number" id="total_sales" class="w-full bg-slate-900 border-2 border-blue-500/30 rounded-2xl p-4 text-3xl font-bold text-white outline-none focus:border-blue-500" placeholder="0.00">
        </div>

        <div class="dark-card p-6 rounded-3xl">
            <h3 class="text-xs font-bold text-slate-400 uppercase mb-4">Dettaglio Elettronico</h3>
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="text-[10px] text-slate-500 font-bold uppercase">Bancomat</label>
                    <input type="number" id="pos" class="input-dark w-full mt-1" oninput="calculate()">
                </div>
                <div>
                    <label class="text-[10px] text-slate-500 font-bold uppercase">SumUp</label>
                    <input type="number" id="sumup" class="input-dark w-full mt-1" oninput="calculate()">
                </div>
                <div>
                    <label class="text-[10px] text-slate-500 font-bold uppercase">Satispay</label>
                    <input type="number" id="satispay" class="input-dark w-full mt-1" oninput="calculate()">
                </div>
                <div>
                    <label class="text-[10px] text-slate-500 font-bold uppercase">Just Eat</label>
                    <input type="number" id="justeat" class="input-dark w-full mt-1" oninput="calculate()">
                </div>
                <div>
                    <label class="text-[10px] text-slate-500 font-bold uppercase">Deliveroo</label>
                    <input type="number" id="deliveroo" class="input-dark w-full mt-1" oninput="calculate()">
                </div>
                <div>
                    <label class="text-[10px] text-slate-500 font-bold uppercase">Glovo</label>
                    <input type="number" id="glovo" class="input-dark w-full mt-1" oninput="calculate()">
                </div>
            </div>
        </div>

        <div class="dark-card p-6 rounded-3xl">
            <h3 class="text-xs font-bold text-slate-400 uppercase mb-4">Uscite Fornitori (Cash)</h3>
            <div id="supplierList" class="space-y-3">
                </div>
        </div>

        <div class="bg-blue-600 p-6 rounded-[2.5rem] shadow-2xl space-y-4">
            <div class="flex justify-between text-blue-100 text-sm">
                <span>Totale Elettronico:</span>
                <span id="label_ele" class="font-bold">€ 0.00</span>
            </div>
            <div class="flex justify-between text-blue-100 text-sm">
                <span>Totale Spese Cash:</span>
                <span id="label_sup" class="font-bold">€ 0.00</span>
            </div>
            <div class="pt-2 border-t border-blue-400 flex justify-between items-center">
                <span class="font-bold text-white">CONTANTE NETTO</span>
                <span id="label_net" class="text-3xl font-black text-white italic">€ 0.00</span>
            </div>
            <button onclick="saveDay()" class="w-full bg-white text-blue-600 font-black py-4 rounded-2xl shadow-lg active:scale-95 transition-all">SALVA GIORNATA</button>
        </div>

    </div>

    <script>
        const { jsPDF } = window.jspdf;

        function init() {
            // Data di oggi
            const d = new Date();
            document.getElementById('currentDateDisplay').innerText = d.toLocaleDateString('it-IT', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
            
            // Genera Fornitori
            const container = document.getElementById('supplierList');
            for(let i=1; i<=10; i++) {
                container.innerHTML += `
                    <div class="flex gap-2 items-center">
                        <input type="number" class="sup-amt input-dark flex-1 text-sm p-2" placeholder="Fornitore ${i}">
                        <input type="checkbox" class="sup-check w-6 h-6 accent-green-500" onchange="calculate()">
                    </div>`;
            }
            
            // Listeners
            document.querySelectorAll('input').forEach(i => i.addEventListener('input', calculate));
            loadTodayData();
        }

        function calculate() {
            const total = parseFloat(document.getElementById('total_sales').value) || 0;
            const pos = ["pos", "sumup", "satispay", "justeat", "deliveroo", "glovo"]
                        .reduce((acc, id) => acc + (parseFloat(document.getElementById(id).value) || 0), 0);
            
            let supCash = 0;
            document.querySelectorAll('.sup-amt').forEach((el, i) => {
                if(document.querySelectorAll('.sup-check')[i].checked) supCash += parseFloat(el.value) || 0;
            });

            const net = (total - pos) - supCash;

            document.getElementById('label_ele').innerText = `€ ${pos.toFixed(2)}`;
            document.getElementById('label_sup').innerText = `€ ${supCash.toFixed(2)}`;
            document.getElementById('label_net').innerText = `€ ${net.toFixed(2)}`;

            updateStatus(total, pos, net);
        }

        function updateStatus(total, pos, net) {
            const card = document.getElementById('statusCard');
            const msg = document.getElementById('statusMsg');
            if (pos > total) {
                card.className = "p-5 rounded-3xl border-l-8 bg-red-900/30 border-red-500 text-red-200";
                msg.innerText = "ATTENZIONE: L'elettronico è superiore all'incasso totale!";
            } else if (total === 0) {
                card.className = "p-5 rounded-3xl border-l-8 bg-slate-800 border-slate-600 text-slate-400";
                msg.innerText = "Inserisci i dati per analizzare la giornata.";
            } else {
                card.className = "p-5 rounded-3xl border-l-8 bg-green-900/30 border-green-500 text-green-200";
                msg.innerText = "Operazione bilanciata. Ricordati di versare i contanti.";
            }
        }

        function saveDay() {
            const dateKey = new Date().toISOString().split('T')[0];
            const data = {
                total: document.getElementById('total_sales').value,
                pos: document.getElementById('pos').value,
                sumup: document.getElementById('sumup').value,
                satispay: document.getElementById('satispay').value,
                justeat: document.getElementById('justeat').value,
                deliveroo: document.getElementById('deliveroo').value,
                glovo: document.getElementById('glovo').value,
                supAmts: Array.from(document.querySelectorAll('.sup-amt')).map(e => e.value),
                supChecks: Array.from(document.querySelectorAll('.sup-check')).map(e => e.checked)
            };
            localStorage.setItem('day_' + dateKey, JSON.stringify(data));
            alert("Giornata salvata con successo!");
        }

        function loadTodayData() {
            const dateKey = new Date().toISOString().split('T')[0];
            const saved = localStorage.getItem('day_' + dateKey);
            if(saved) {
                const d = JSON.parse(saved);
                document.getElementById('total_sales').value = d.total;
                document.getElementById('pos').value = d.pos;
                document.getElementById('sumup').value = d.sumup;
                document.getElementById('satispay').value = d.satispay;
                document.getElementById('justeat').value = d.justeat;
                document.getElementById('deliveroo').value = d.deliveroo;
                document.getElementById('glovo').value = d.glovo;
                document.querySelectorAll('.sup-amt').forEach((e, i) => e.value = d.supAmts[i]);
                document.querySelectorAll('.sup-check').forEach((e, i) => e.checked = d.supChecks[i]);
                calculate();
            }
        }

        function exportMonthlyPDF() {
            const doc = new jsPDF();
            const now = new Date();
            const month = now.getMonth() + 1;
            const year = now.getFullYear();
            
            doc.text(`REGISTRO CORRISPETTIVI: ${month}/${year}`, 14, 15);
            
            const rows = [];
            let grandTotal = 0;

            for(let i=1; i<=31; i++) {
                const dayStr = `${year}-${String(month).padStart(2,'0')}-${String(i).padStart(2,'0')}`;
                const saved = localStorage.getItem('day_' + dayStr);
                const data = saved ? JSON.parse(saved) : {total: 0};
                rows.push([i, data.total || 0, ""]);
                grandTotal += parseFloat(data.total || 0);
            }

            doc.autoTable({
                head: [['Giorno', 'Corrispettivo Lordo (€)', 'Note']],
                body: rows,
                startY: 25,
                foot: [['TOTALE', grandTotal.toFixed(2), '']],
                theme: 'grid'
            });

            doc.save(`Corrispettivi_${month}_${year}.pdf`);
        }

        init();
    </script>
</body>
</html>
