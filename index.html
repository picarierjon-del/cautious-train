<!DOCTYPE html>
<html lang="it" class="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>OMNIA COMMANDER - NAVY SEAL FIX</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: sans-serif; background-color: #020617; color: #f8fafc; margin: 0; padding: 0; }
        .glass-card { background: rgba(15, 23, 42, 0.8); border: 1px solid rgba(51, 65, 85, 0.4); border-radius: 24px; }
        .input-tactical { background: #0f172a; border: 1px solid #1e293b; color: white; border-radius: 14px; padding: 14px; width: 100%; text-align: center; font-weight: 800; outline: none; }
        .input-tactical:focus { border-color: #3b82f6; }
        .tab-btn { flex: 1; padding: 12px; font-size: 11px; font-weight: 800; border-radius: 16px; color: #64748b; text-transform: uppercase; cursor: pointer; border: none; background: transparent; }
        .tab-btn.active { background: #3b82f6; color: white; }
        .hidden { display: none !important; }
        .sup-row { display: flex; align-items: center; gap: 8px; background: #0f172a; padding: 10px; border-radius: 12px; margin-bottom: 8px; border: 1px solid #1e293b; }
    </style>
</head>
<body class="pb-40">

    <div id="authScreen" class="fixed inset-0 z-[9999] bg-[#020617] flex items-center justify-center p-6">
        <div class="glass-card p-8 w-full max-w-sm text-center border-t-4 border-blue-600">
            <h1 class="text-2xl font-black mb-6 italic uppercase">OMNIA <span class="text-blue-500">SEAL</span></h1>
            <input type="password" id="pinInput" class="input-tactical text-3xl tracking-[0.5em] mb-4" placeholder="****" maxlength="4" inputmode="numeric">
            <button id="btnUnlock" onclick="checkAuth()" class="w-full bg-blue-600 py-4 rounded-xl font-black uppercase tracking-widest text-white shadow-lg">Sblocca</button>
            <p class="text-[10px] text-slate-500 mt-4 uppercase tracking-widest">Master PIN: 1234</p>
        </div>
    </div>

    <div id="mainUI" class="hidden">
        <nav class="p-5 border-b border-slate-800 flex justify-between items-center bg-[#020617]/90 sticky top-0 z-50 backdrop-blur-md">
            <div>
                <p id="topDate" class="text-[10px] font-bold text-blue-500 uppercase"></p>
                <h1 class="text-lg font-black italic">NAVY SEAL COMMAND</h1>
            </div>
            <div class="flex gap-2">
                <button onclick="exportPDF()" class="p-2 bg-slate-800 rounded-lg text-blue-400">PDF</button>
                <button onclick="backupToFile()" class="p-2 bg-slate-800 rounded-lg text-slate-400">BK</button>
            </div>
        </nav>

        <div class="p-4 space-y-4">
            <div class="glass-card p-6 border-l-4 border-blue-500">
                <p class="text-[10px] font-bold text-slate-500 uppercase">Cash Reale Disponibile</p>
                <h3 id="netCashDisplay" class="text-4xl font-black text-green-400">€ 0.00</h3>
                <p id="splitInfo" class="text-[9px] text-slate-400 mt-1 uppercase">—</p>
            </div>

            <div class="flex gap-1 p-1 bg-slate-900 rounded-2xl border border-slate-800">
                <button id="tab1" onclick="switchTab('day')" class="tab-btn active">Operativo</button>
                <button id="tab2" onclick="switchTab('bank')" class="tab-btn">Banca</button>
                <button id="tab3" onclick="switchTab('config')" class="tab-btn">Setup</button>
            </div>

            <div id="sec-day" class="space-y-4">
                <div class="flex gap-2 items-center">
                    <button onclick="changeDate(-1)" class="p-3 bg-slate-800 rounded-xl">◀</button>
                    <input type="date" id="datePicker" class="input-tactical flex-1 text-sm py-2">
                    <button onclick="changeDate(1)" class="p-3 bg-slate-800 rounded-xl">▶</button>
                </div>

                <div class="glass-card p-6">
                    <label class="block text-center text-[10px] font-bold text-slate-500 uppercase mb-2">Chiusura Lordo Z</label>
                    <input type="number" id="total_sales" class="bg-transparent text-5xl font-black text-white w-full text-center outline-none" placeholder="0.00" oninput="runLogic()">
                    <div class="grid grid-cols-2 gap-4 mt-4 pt-4 border-t border-slate-800">
                        <input type="number" id="n_clients" placeholder="Clienti" class="input-tactical py-2 text-sm" oninput="runLogic()">
                        <input type="number" id="acconti" placeholder="Acconti +" class="input-tactical py-2 text-sm border-orange-900/50 text-orange-400" oninput="runLogic()">
                    </div>
                </div>

                <div class="glass-card p-4 grid grid-cols-2 gap-2">
                    <p class="col-span-2 text-[10px] font-bold text-blue-500 uppercase italic">Digitale / Delivery</p>
                    <input type="number" id="p_bancomat" placeholder="POS" class="input-tactical py-2 text-xs" oninput="runLogic()">
                    <input type="number" id="p_delivery" placeholder="App" class="input-tactical py-2 text-xs" oninput="runLogic()">
                </div>

                <div class="glass-card p-4">
                    <div class="flex justify-between items-center mb-4">
                        <p class="text-[10px] font-bold text-red-500 uppercase">Uscite Cash Fornitori</p>
                        <button onclick="openSupModal()" class="text-[9px] bg-slate-800 px-3 py-1 rounded text-blue-400">EDIT NOMI</button>
                    </div>
                    <div id="supList"></div>
                    <div class="mt-3 flex justify-between text-xs font-bold p-2 bg-black/20 rounded-lg">
                        <span>TOTALE USCITE:</span>
                        <span id="supCashTotal" class="text-red-400">€ 0.00</span>
                    </div>
                </div>
            </div>

            <div id="sec-bank" class="hidden space-y-4">
                <div class="glass-card p-6 text-center border-l-4 border-green-500">
                    <p class="text-[10px] font-bold text-slate-500 uppercase">Versamento Settimanale Stimato</p>
                    <h2 id="bankTotal" class="text-4xl font-black">€ 0.00</h2>
                </div>
                <div id="bankHistory" class="space-y-2"></div>
            </div>

            <div id="sec-config" class="hidden glass-card p-6 space-y-4">
                <h3 class="font-black uppercase text-sm italic">Parametri Business</h3>
                <input type="number" id="fixed_costs" placeholder="Costi Fissi" class="input-tactical text-sm" value="3000" oninput="runLogic()">
                <input type="number" id="tax_rate" placeholder="Tasse %" class="input-tactical text-sm" value="25" oninput="runLogic()">
                <button onclick="wipeAll()" class="w-full py-4 bg-red-900/20 text-red-500 rounded-xl font-bold text-xs uppercase border border-red-900/40">Nuclear Wipe (Format)</button>
            </div>
        </div>

        <div class="fixed bottom-0 left-0 right-0 p-6 bg-[#020617]/95 border-t border-slate-800 backdrop-blur-xl flex justify-between items-center z-[100]">
            <div>
                <p class="text-[9px] font-bold text-slate-500 uppercase">Oggi</p>
                <div id="theoCash" class="text-3xl font-black text-white italic">€ 0.00</div>
            </div>
            <button onclick="saveData()" class="bg-blue-600 text-white font-black px-10 py-5 rounded-2xl shadow-xl uppercase text-xs">Salva Missione</button>
        </div>
    </div>

    <div id="supModal" class="hidden fixed inset-0 z-[10000] bg-black/90 flex items-center justify-center p-4">
        <div class="glass-card p-6 w-full max-w-md">
            <h3 class="font-black mb-4 uppercase">Configura Asset Fornitori</h3>
            <div id="supConfigList" class="space-y-2 max-h-[50vh] overflow-y-auto pr-2"></div>
            <button onclick="saveSupConfig()" class="w-full bg-blue-600 py-4 rounded-xl mt-6 font-black uppercase text-sm">Aggiorna Inventory</button>
        </div>
    </div>

    <script>
        let activeDate = new Date();
        const masterPin = "1234";

        // --- AUTH ---
        function checkAuth() {
            const pin = document.getElementById('pinInput').value;
            if(pin === masterPin) {
                document.getElementById('authScreen').style.display = 'none';
                document.getElementById('mainUI').classList.remove('hidden');
                init();
            } else {
                alert("ACCESSO NEGATO");
                document.getElementById('pinInput').value = "";
            }
        }

        // --- INIT ---
        function init() {
            updateDateUI();
            renderSuppliers();
            loadDateData();
        }

        function updateDateUI() {
            const ymd = activeDate.toISOString().split('T')[0];
            document.getElementById('datePicker').value = ymd;
            document.getElementById('topDate').innerText = activeDate.toLocaleDateString('it-IT', { weekday:'long', day:'numeric', month:'long' });
        }

        function renderSuppliers() {
            const names = JSON.parse(localStorage.getItem('seal_sup_names')) || Array.from({length:12}, (_,i)=>`Fornitore ${i+1}`);
            const list = document.getElementById('supList');
            list.innerHTML = "";
            names.forEach((name, i) => {
                const row = document.createElement('div');
                row.className = "sup-row";
                row.innerHTML = `
                    <span class="text-[10px] font-bold flex-1 truncate">${name}</span>
                    <input type="number" class="sup-amt input-tactical !w-20 !py-1 !text-xs" placeholder="0.00" oninput="runLogic()">
                    <input type="checkbox" class="sup-check w-5 h-5 accent-blue-600" onchange="runLogic()">
                `;
                list.appendChild(row);
            });
        }

        // --- LOGICA ---
        function runLogic() {
            const total = parseFloat(document.getElementById('total_sales').value) || 0;
            const acconti = parseFloat(document.getElementById('acconti').value) || 0;
            const pos = parseFloat(document.getElementById('p_bancomat').value) || 0;
            const delivery = parseFloat(document.getElementById('p_delivery').value) || 0;

            let supCash = 0;
            const amts = document.querySelectorAll('.sup-amt');
            const checks = document.querySelectorAll('.sup-check');
            amts.forEach((amt, i) => {
                if(checks[i].checked) supCash += parseFloat(amt.value) || 0;
            });

            const netCashToday = (total - pos - delivery - supCash) + acconti;

            document.getElementById('theoCash').innerText = "€ " + netCashToday.toFixed(2);
            document.getElementById('netCashDisplay').innerText = "€ " + netCashToday.toFixed(2);
            document.getElementById('supCashTotal').innerText = "€ " + supCash.toFixed(2);
            document.getElementById('splitInfo').innerText = `Digitale: € ${(pos+delivery).toFixed(2)} | In Cassaforte: € ${(total - pos - delivery).toFixed(2)}`;
        }

        // --- DATA ---
        function saveData() {
            const key = "seal_data_" + activeDate.toISOString().split('T')[0];
            const data = {
                total: document.getElementById('total_sales').value,
                n_clients: document.getElementById('n_clients').value,
                acconti: document.getElementById('acconti').value,
                pos: document.getElementById('p_bancomat').value,
                delivery: document.getElementById('p_delivery').value,
                supAmts: Array.from(document.querySelectorAll('.sup-amt')).map(e => e.value),
                supChecks: Array.from(document.querySelectorAll('.sup-check')).map(e => e.checked)
            };
            localStorage.setItem(key, JSON.stringify(data));
            alert("RAPPORTO ARCHIVIATO");
            runLogic();
        }

        function loadDateData() {
            const key = "seal_data_" + activeDate.toISOString().split('T')[0];
            const data = JSON.parse(localStorage.getItem(key));
            if(data) {
                document.getElementById('total_sales').value = data.total || "";
                document.getElementById('n_clients').value = data.n_clients || "";
                document.getElementById('acconti').value = data.acconti || "";
                document.getElementById('p_bancomat').value = data.pos || "";
                document.getElementById('p_delivery').value = data.delivery || "";
                const amts = document.querySelectorAll('.sup-amt');
                const checks = document.querySelectorAll('.sup-check');
                amts.forEach((e, i) => e.value = data.supAmts[i] || "");
                checks.forEach((e, i) => e.checked = data.supChecks[i] || false);
            } else {
                document.querySelectorAll('input[type="number"]').forEach(i => i.value = "");
                document.querySelectorAll('.sup-check').forEach(c => c.checked = false);
            }
            runLogic();
        }

        // --- TABS & NAV ---
        function switchTab(tab) {
            document.getElementById('sec-day').classList.toggle('hidden', tab !== 'day');
            document.getElementById('sec-bank').classList.toggle('hidden', tab !== 'bank');
            document.getElementById('sec-config').classList.toggle('hidden', tab !== 'config');
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            if(tab === 'day') document.getElementById('tab1').classList.add('active');
            if(tab === 'bank') { document.getElementById('tab2').classList.add('active'); renderBankReport(); }
            if(tab === 'config') document.getElementById('tab3').classList.add('active');
        }

        function changeDate(n) {
            activeDate.setDate(activeDate.getDate() + n);
            updateDateUI();
            loadDateData();
        }

        function openSupModal() {
            const names = JSON.parse(localStorage.getItem('seal_sup_names')) || Array.from({length:12}, (_,i)=>`Fornitore ${i+1}`);
            const list = document.getElementById('supConfigList');
            list.innerHTML = "";
            names.forEach((name, i) => {
                list.innerHTML += `<input type="text" class="sup-name-input input-tactical !py-2 text-xs mb-2" value="${name}" data-idx="${i}">`;
            });
            document.getElementById('supModal').classList.remove('hidden');
        }

        function saveSupConfig() {
            const inputs = document.querySelectorAll('.sup-name-input');
            const newNames = Array.from(inputs).map(i => i.value);
            localStorage.setItem('seal_sup_names', JSON.stringify(newNames));
            document.getElementById('supModal').classList.add('hidden');
            renderSuppliers();
            loadDateData();
        }

        function renderBankReport() {
            const list = document.getElementById('bankHistory');
            list.innerHTML = "";
            let grandTotal = 0;
            for(let i=0; i<7; i++) {
                const d = new Date(activeDate); d.setDate(d.getDate() - i);
                const key = "seal_data_" + d.toISOString().split('T')[0];
                const s = JSON.parse(localStorage.getItem(key));
                if(s) {
                    const supCash = s.supAmts.reduce((a,v,idx) => a + (s.supChecks[idx] ? (parseFloat(v)||0) : 0), 0);
                    const net = (parseFloat(s.total)||0) - (parseFloat(s.pos)||0) - (parseFloat(s.delivery)||0) - supCash + (parseFloat(s.acconti)||0);
                    grandTotal += net;
                    list.innerHTML += `<div class="flex justify-between p-3 glass-card text-xs"><span>${d.toLocaleDateString('it-IT')}</span><b>€ ${net.toFixed(2)}</b></div>`;
                }
            }
            document.getElementById('bankTotal').innerText = "€ " + grandTotal.toFixed(2);
        }

        function wipeAll() { if(confirm("CANCELLARE TUTTO?")) { localStorage.clear(); location.reload(); } }
        
        function backupToFile() {
            const data = JSON.stringify(localStorage);
            const blob = new Blob([data], {type: "application/json"});
            const a = document.createElement("a");
            a.href = URL.createObjectURL(blob);
            a.download = "seal_backup.json";
            a.click();
        }

        function exportPDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            doc.text("REPORT NAVY SEAL - DATA: " + activeDate.toISOString().split('T')[0], 14, 20);
            doc.text("Incasso Netto Cassetto: " + document.getElementById('theoCash').innerText, 14, 30);
            doc.save("Report_Seal.pdf");
        }
    </script>
</body>
</html>
